name: Publicar versión

# Se ejecuta cuando se crea una etiqueta (tag) de versión sobre el trunk, por ejemplo:
#   git tag v1.1.0 && git push origin v1.1.0
on:
  push:
    tags: ['v*']

permissions:
  contents: write   # necesario para crear la release y adjuntar el jar

jobs:
  publicar:
    name: Generar artefacto y release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Calcular la versión a partir de la etiqueta (v1.1.0 -> 1.1.0)
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Construir y probar con esa versión
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon -PversionApp="$VERSION"

      - name: Crear la release y adjuntar el jar
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" build/libs/*.jar \
            --title "Versión $VERSION" \
            --generate-notes
